# ==============================================================================
# 雀魂联赛分析 CI/CD
#
# 1) test  —— 每次 push / PR 都跑全量测试（校验代码）。
# 2) deploy —— 仅 master 分支、且仓库设置 Variables.DEPLOY_ENABLED = 'true' 时触发：
#    通过 SSH 登录服务器拉取最新代码并重启服务。默认关闭，避免未配置时报错。
#
# 启用部署前，请在仓库 Settings → Secrets and variables → Actions 配置：
#   Variables:
#     DEPLOY_ENABLED           = 'true'                 # 打开部署开关
#     DEPLOY_SERVICE           = 你的 systemd 服务名      # 可选，不能留空则用下方默认
#     DEPLOY_PATH              = 服务器上的代码目录        # 可选，默认见下
#   Secrets:
#     DEPLOY_HOST              = 服务器地址(IP/域名)
#     DEPLOY_USER              = SSH 登录用户
#     DEPLOY_KEY               = SSH 私钥（你服务器的公钥请加入 ~/.ssh/authorized_keys）
#     DEPLOY_PORT              = SSH 端口（可选，默认 22）
#     DEPLOY_RESTART           = 重启命令（可选，默认 systemctl restart <服务名>）
# ==============================================================================

name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  test:
    name: 测试校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: 安装依赖
        run: pip install -r requirements-dev.txt

      - name: 运行测试
        run: python -m pytest -q

  deploy:
    name: 部署到服务器
    needs: test
    if: github.ref == 'refs/heads/master' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: SSH 拉取代码并重启服务
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT && secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            REPO_PATH="${{ vars.DEPLOY_PATH && vars.DEPLOY_PATH || '/opt/majsoul-league-analyzer' }}"
            SERVICE="${{ vars.DEPLOY_SERVICE && vars.DEPLOY_SERVICE || 'majsoul-league-analyzer' }}"
            cd "$REPO_PATH"
            git fetch origin master
            git reset --hard origin/master
            [ -d .venv ] || python3 -m venv .venv
            ./.venv/bin/pip install -r requirements.txt
            "${{ secrets.DEPLOY_RESTART }}" || systemctl restart "$SERVICE"
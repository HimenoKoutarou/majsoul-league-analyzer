<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理后台</title>
<link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
<nav class="nav">
  <span class="brand">联赛</span>
  <a href="/">首页</a><a href="/games">对局</a>
  <a href="/analysis">分析</a><a href="/lineups">出战名单</a><a href="/bounties">悬赏</a><a href="/captain">队长</a><a href="/admin" class="active">管理</a>
  <span class="muted" id="whoami" style="margin-left:auto"></span>
  <button class="btn" id="logout-btn" style="margin-left:8px">登出</button>
</nav>
<div class="container">
  <h1>管理后台</h1>

  <div class="tabs">
    <button class="btn on" data-tab="league">联赛</button>
    <button class="btn" data-tab="teams">队伍与选手</button>
    <button class="btn" data-tab="bounties">悬赏</button>
    <button class="btn" data-tab="sync">数据同步</button>
  </div>

  <div id="tab-league" class="card">
    <h3>联赛信息</h3>
    <p><label>名称 <input id="lg-name" style="width:280px"></label>
       <label>简介 <input id="lg-desc" style="width:320px"></label></p>
    <p><label>赛事场ID <input id="lg-contest" type="number" style="width:120px"></label>
       <button class="btn primary" id="lg-save">保存</button></p>
    <p><label>Logo <input type="file" id="lg-logo" accept=".png,.jpg,.jpeg,.webp,.svg"></label></p>
    <hr>
    <h3>积分规则</h3>
    <p>顺位分 <input id="rp0" type="number" style="width:70px" value="90">
      <input id="rp1" type="number" style="width:70px" value="45">
      <input id="rp2" type="number" style="width:70px" value="0">
      <input id="rp3" type="number" style="width:70px" value="-45">
      <button class="btn primary" id="rp-save">保存积分规则</button></p>
  </div>

  <div id="tab-teams" class="card" style="display:none">
    <h3>队伍</h3>
    <div id="team-list" style="margin-bottom:16px"></div>
    <p>新增：<input id="team-name" placeholder="队名">
       <input id="team-short" placeholder="简称" style="width:80px">
       <input id="team-color" type="color" value="#5b8cff">
       <button class="btn" id="team-add">添加</button></p>
    <hr>
    <h3>队长账号（队长用账号密码登录后提交出战名单）</h3>
    <div id="captain-list" style="margin-bottom:16px"></div>
    <hr>
    <h3>选手名单</h3>
    <div id="player-list" style="margin-bottom:16px;max-height:420px;overflow:auto"></div>
    <p>新增：<input id="pl-nick" placeholder="昵称">
       <input id="pl-account" type="number" placeholder="雀魂ID(必填)" style="width:140px">
       <select id="pl-team"></select>
       <button class="btn" id="pl-add">添加</button></p>
    <hr>
    <h3>已提交的出战名单</h3>
    <div id="admin-lineup-list"></div>
  </div>

  <div id="tab-bounties" class="card" style="display:none">
    <h3>悬赏审核</h3>
    <div id="admin-bounty-list" style="margin-bottom:16px"></div>
    <hr>
    <h3>牌谱审核</h3>
    <div id="admin-claim-list"></div>
  </div>

  <div id="tab-sync" class="card" style="display:none">
    <h3>赛事场初始化（首次）</h3>
    <p>赛事场ID <input id="init-contest" type="number" style="width:110px">
       组织者账号 <input id="init-user" style="width:160px">
       密码 <input id="init-pass" type="password" style="width:160px">
       <button class="btn primary" id="init-btn">拉取赛事信息与名单</button></p>
    <hr>
    <h3>同步对局</h3>
    <p>组织者账号 <input id="sync-user" style="width:160px">
       密码 <input id="sync-pass" type="password" style="width:160px">
       <button class="btn primary" id="sync-btn">开始同步</button>
       <span class="muted" id="sync-status"></span></p>
    <hr>
    <h3>分享链接录入（无需账号）</h3>
    <p><input id="share-url" style="min-width:420px"
       placeholder="https://game.maj-soul.com/1/?paipu=xxxx">
       <button class="btn primary" id="ingest-btn">录入</button></p>
    <hr>
    <h3>自动检测（赛事场有更新自动同步）</h3>
    <div id="auto-sync-status" class="muted">加载中…</div>
    <hr>
    <h3>同步历史</h3>
    <div id="sync-runs"></div>
  </div>
</div>
<script type="module">
import { api, toast, esc, isLoggedIn, logout } from "/static/js/api.js";

const $ = (id) => document.getElementById(id);
const H = () => ({ "Content-Type": "application/json" });
const authed = () => isLoggedIn();
async function guard() {
  if (!(await authed())) {
    const next = encodeURIComponent(location.pathname + location.search);
    location.href = `/admin/login?next=${next}`;
    return false;
  }
  return true;
}

$("logout-btn").onclick = () => logout();
(async () => {
  if (!(await isLoggedIn())) {
    const next = encodeURIComponent(location.pathname + location.search);
    location.href = `/admin/login?next=${next}`;
    return;
  }
  try {
    const me = await api("/api/admin/me");
    $("whoami").textContent = `已登录：${me.username}`;
  } catch (e) { /* ignore */ }
})();
document.querySelectorAll(".tabs .btn").forEach((b) => b.onclick = () => {
  document.querySelectorAll(".tabs .btn").forEach((x) => x.classList.remove("on"));
  b.classList.add("on");
  ["league", "teams", "bounties", "sync"].forEach((t) => {
    const show = b.dataset.tab === t;
    $(`tab-${t}`).style.display = show ? "" : "none";
    if (show && t === "bounties") { loadAdminBounties(); loadAdminClaims(); }
  });
});

async function loadLeague() {
  const lg = await api("/api/league");
  $("lg-name").value = lg.name; $("lg-desc").value = lg.description || "";
  $("lg-contest").value = lg.contest_id || "";
  const rp = lg.score_rule.rank_points;
  ["rp0", "rp1", "rp2", "rp3"].forEach((id, i) => $(id).value = rp[i]);
}
$("lg-save").onclick = async () => { if (!await guard()) return;
  await api("/api/admin/league", { method: "PUT", headers: H(),
    body: JSON.stringify({ name: $("lg-name").value, description: $("lg-desc").value,
      contest_id: +$("lg-contest").value || null }) });
  toast("已保存"); };
$("lg-logo").onchange = async (e) => { if (!await guard()) return;
  const fd = new FormData(); fd.append("file", e.target.files[0]);
  const resp = await fetch("/api/admin/league/logo", {
    method: "PUT", credentials: "same-origin", body: fd });
  if (resp.status === 401) { toast("请重新登录"); setTimeout(() => logout(), 1000); return; }
  toast(resp.ok ? "Logo 已更新" : "上传失败"); };
$("rp-save").onclick = async () => { if (!await guard()) return;
  await api("/api/admin/score-rule", { method: "PUT", headers: H(),
    body: JSON.stringify({ rank_points: [+$("rp0").value, +$("rp1").value,
      +$("rp2").value, +$("rp3").value] }) });
  toast("积分规则已保存"); };

async function loadTeams() {
  const teams = await api("/api/teams");
  $("team-list").innerHTML = teams.map((t) => {
    const members = t.players.map((p) =>
      `<span class="member-chip">${esc(p.nickname)}<span class="muted">(雀魂ID ${p.account_id ?? "—"})</span></span>`).join("");
    return `
      <div style="padding:8px 0;border-bottom:1px solid #e5e7eb">
        <div style="display:flex;gap:10px;align-items:center">
          <span class="team-dot" style="background:${t.color}"></span><b>${esc(t.name)}</b>
          <span class="muted">${t.players.length} 名选手</span>
          <button class="btn" data-del="${t.id}">删除</button>
        </div>
        <div style="margin:6px 0 0 20px;display:flex;gap:8px;flex-wrap:wrap">
          ${members || `<span class="muted">暂无选手</span>`}
        </div>
      </div>`;
  }).join("") || `<span class="muted">暂无队伍</span>`;
  $("team-list").querySelectorAll("[data-del]").forEach((b) => b.onclick = async () => {
    if (!await guard()) return;
    await api(`/api/admin/teams/${b.dataset.del}`, { method: "DELETE" }); loadTeams(); loadPlayers(); });
  $("pl-team").innerHTML = `<option value="">(无队伍)</option>` +
    teams.map((t) => `<option value="${t.id}">${esc(t.name)}</option>`).join("");
}
$("team-add").onclick = async () => { if (!await guard()) return;
  await api("/api/admin/teams", { method: "POST", headers: H(),
    body: JSON.stringify({ name: $("team-name").value, short_name: $("team-short").value,
      color: $("team-color").value }) });
  $("team-name").value = ""; loadTeams(); };

async function loadPlayers() {
  const teams = await api("/api/teams");
  const players = await api("/api/admin/players");
  $("player-list").innerHTML = players.map((p) => `
    <div style="display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid #e5e7eb">
      <b>${esc(p.nickname)}</b>
      <span class="muted">雀魂ID ${p.account_id ?? "—"}</span>
      <select data-pid="${p.id}">
        <option value="">(无队伍)</option>
        ${teams.map((t) => `<option value="${t.id}" ${p.team_id === t.id ? "selected" : ""}>${esc(t.name)}</option>`).join("")}
      </select>
    </div>`).join("") || `<span class="muted">暂无选手</span>`;
  $("player-list").querySelectorAll("select[data-pid]").forEach((sel) => sel.onchange = async () => {
    if (!await guard()) return;
    await api(`/api/admin/players/${sel.dataset.pid}`, { method: "PUT", headers: H(),
      body: JSON.stringify({ team_id: +sel.value || null }) });
    toast("已分配队伍"); loadTeams(); });
}
$("pl-add").onclick = async () => { if (!await guard()) return;
  const nickname = $("pl-nick").value.trim();
  const accountId = $("pl-account").value.trim();
  if (!nickname) { toast("昵称不能为空"); return; }
  if (!accountId || +accountId <= 0) { toast("雀魂ID必填"); return; }
  await api("/api/admin/players", { method: "POST", headers: H(),
    body: JSON.stringify({ nickname, account_id: +accountId,
      team_id: +$("pl-team").value || null }) });
  $("pl-nick").value = ""; $("pl-account").value = ""; loadPlayers(); loadTeams(); };

$("init-btn").onclick = async () => { if (!await guard()) return;
  toast("正在连接赛事场…");
  try {
    const r = await api("/api/admin/league/init-from-contest", { method: "POST", headers: H(),
      body: JSON.stringify({ contest_id: +$("init-contest").value,
        username: $("init-user").value, password: $("init-pass").value }) });
    toast(`初始化成功：${r.name}（${r.players} 名选手）`);
    loadLeague(); loadPlayers();
  } catch (e) { toast("失败：" + e.message, 4000); } };

$("sync-btn").onclick = async () => { if (!await guard()) return;
  try {
    await api("/api/admin/sync", { method: "POST", headers: H(),
      body: JSON.stringify({ username: $("sync-user").value, password: $("sync-pass").value }) });
    toast("同步已开始");
    pollStatus();
  } catch (e) { toast("失败：" + e.message, 4000); } };
async function pollStatus() {
  const timer = setInterval(async () => {
    try {
      const s = await api("/api/admin/sync/status");
      $("sync-status").textContent = s.running ? `同步中…` : (s.error || "完成");
      if (!s.running) { clearInterval(timer); loadRuns(); loadAutoSync(); }
    } catch (e) { clearInterval(timer); }
  }, 2000);
}
$("ingest-btn").onclick = async () => { if (!await guard()) return;
  toast("获取牌谱中，可能需要数秒…");
  try {
    const r = await api("/api/admin/games/ingest", { method: "POST", headers: H(),
      body: JSON.stringify({ share_url: $("share-url").value }) });
    toast(`已录入 ${r.uuid}`);
    loadRuns();
  } catch (e) { toast("失败：" + e.message, 5000); } };
async function loadRuns() {
  if (!authed()) return;
  try {
    const runs = await api("/api/admin/sync-runs");
    $("sync-runs").innerHTML = runs.map((r) => `
      <div class="muted">#${r.id} ${r.channel} ${r.status} · 新增${r.games_added}场
      ${r.errors && r.errors.length ? ` · 错误${r.errors.length}条` : ""}
      · ${r.started_at || ""}</div>`).join("") || `<span class="muted">暂无</span>`;
  } catch (e) { /* token 无效时忽略 */ }
}
async function loadAutoSync() {
  try {
    const s = await api("/api/admin/sync/auto-status");
    if (!s.enabled) {
      $("auto-sync-status").innerHTML =
        `<span class="muted">未开启（设 AUTO_SYNC_ENABLED=true 并配置 DHS_USERNAME / DHS_PASSWORD）</span>`;
      return;
    }
    const label = { success: "成功", partial: "部分成功", skipped: "已跳过", failed: "失败" }[s.last_status] || (s.last_status || "—");
    const parts = [
      `每天 ${s.schedule || "22:00"}`,
      `上次 ${s.last_run_at ? s.last_run_at.replace("T", " ").slice(0, 19) : "—"}`,
      `新增 ${s.last_added} 场`,
      `结果 ${label}`,
    ];
    if (s.next_run_at) parts.push(`下次 ${s.next_run_at.replace("T", " ").slice(0, 19)}`);
    if (s.last_error) parts.push(`<span style="color:#b91c1c">${esc(s.last_error)}</span>`);
    $("auto-sync-status").innerHTML = parts.join(" · ");
  } catch (e) { /* ignore */ }
}

function bountyStatusTag(s) {
  const map = { pending: "待审核", approved: "进行中", rejected: "已驳回", closed: "已满额" };
  return `<span class="tag">${map[s] || s}</span>`;
}
function claimStatusTag(s) {
  const map = { pending: "待审核", approved: "已通过", rejected: "已驳回" };
  return `<span class="tag">${map[s] || s}</span>`;
}
async function loadAdminBounties() {
  if (!authed()) return;
  try {
    const rows = await api("/api/admin/bounties");
    $("admin-bounty-list").innerHTML = rows.map((b) => `
      <div style="padding:10px 0;border-bottom:1px solid #e5e7eb">
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <b>${esc(b.title)}</b>${bountyStatusTag(b.status)}
          <span class="muted">目标 ${b.target_date || "—"} · 达成 ${b.claimed_count}/${b.max_claims}</span>
        </div>
        <div class="muted" style="margin:4px 0">${esc(b.description)}</div>
        ${b.reward ? `<div class="muted">奖励：${esc(b.reward)}</div>` : ""}
        <div class="muted">提交人：${esc(b.submitter_nickname || "匿名")}${b.submitter_account_id ? `（雀魂ID ${b.submitter_account_id}）` : ""}</div>
        <div style="display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap">
          <label class="muted">达成次数 <input type="number" min="1" value="${b.max_claims}" data-max="${b.id}" style="width:64px"></label>
          <button class="btn" data-save-max="${b.id}">保存次数</button>
          ${b.status !== "approved" ? `<button class="btn primary" data-bounty-status="${b.id}:approved">通过</button>` : ""}
          ${b.status !== "rejected" && b.status !== "closed" ? `<button class="btn" data-bounty-status="${b.id}:rejected">驳回</button>` : ""}
          ${b.status === "approved" ? `<button class="btn" data-bounty-status="${b.id}:closed">关闭</button>` : ""}
        </div>
      </div>`).join("") || `<span class="muted">暂无悬赏</span>`;
    $("admin-bounty-list").querySelectorAll("[data-save-max]").forEach((btn) => btn.onclick = async () => {
      if (!await guard()) return;
      const val = +$("admin-bounty-list").querySelector(`[data-max="${btn.dataset.saveMax}"]`).value;
      if (!(val >= 1)) { toast("次数至少为 1"); return; }
      await api(`/api/admin/bounties/${btn.dataset.saveMax}`, { method: "PUT", headers: H(), body: JSON.stringify({ max_claims: val }) });
      toast("已保存"); loadAdminBounties();
    });
    $("admin-bounty-list").querySelectorAll("[data-bounty-status]").forEach((btn) => btn.onclick = async () => {
      if (!await guard()) return;
      const [id, status] = btn.dataset.bountyStatus.split(":");
      await api(`/api/admin/bounties/${id}`, { method: "PUT", headers: H(), body: JSON.stringify({ status }) });
      toast("已更新"); loadAdminBounties();
    });
  } catch (e) { /* ignore */ }
}
async function loadAdminClaims() {
  if (!authed()) return;
  try {
    const rows = await api("/api/admin/claims");
    $("admin-claim-list").innerHTML = rows.map((c) => `
      <div style="padding:10px 0;border-bottom:1px solid #e5e7eb">
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <b>${esc(c.bounty_title)}</b>${claimStatusTag(c.status)}
          <span class="muted">${esc(c.submitter_nickname || "匿名")}${c.submitter_account_id ? `（雀魂ID ${c.submitter_account_id}）` : ""}</span>
        </div>
        <div style="margin:4px 0"><a href="${esc(c.share_url)}" target="_blank" rel="noopener">${esc(c.share_url)}</a></div>
        ${c.note ? `<div class="muted">备注：${esc(c.note)}</div>` : ""}
        <div style="display:flex;gap:8px;margin-top:8px">
          ${c.status !== "approved" ? `<button class="btn primary" data-claim-status="${c.id}:approved">通过</button>` : ""}
          ${c.status !== "rejected" ? `<button class="btn" data-claim-status="${c.id}:rejected">驳回</button>` : ""}
        </div>
      </div>`).join("") || `<span class="muted">暂无提交</span>`;
    $("admin-claim-list").querySelectorAll("[data-claim-status]").forEach((btn) => btn.onclick = async () => {
      if (!await guard()) return;
      const [id, status] = btn.dataset.claimStatus.split(":");
      await api(`/api/admin/claims/${id}`, { method: "PUT", headers: H(), body: JSON.stringify({ status }) });
      toast("已更新"); loadAdminClaims(); loadAdminBounties();
    });
  } catch (e) { /* ignore */ }
}

async function loadCaptains() {
  if (!authed()) return;
  try {
    const rows = await api("/api/admin/captains");
    $("captain-list").innerHTML = rows.map((t) => `
      <div style="padding:8px 0;border-bottom:1px solid #e5e7eb;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <span class="team-dot" style="background:${t.color}"></span><b>${esc(t.team_name)}</b>
        <input data-cap-user="${t.team_id}" placeholder="队长用户名" value="${esc(t.username || "")}" style="width:150px">
        <input data-cap-pass="${t.team_id}" type="text" placeholder="新密码(≥6位)" style="width:150px">
        <button class="btn primary" data-cap-save="${t.team_id}">${t.has_account ? "重置密码" : "创建账号"}</button>
      </div>`).join("") || `<span class="muted">暂无队伍</span>`;
    $("captain-list").querySelectorAll("[data-cap-save]").forEach((btn) => btn.onclick = async () => {
      if (!await guard()) return;
      const tid = btn.dataset.capSave;
      const username = $("captain-list").querySelector(`[data-cap-user="${tid}"]`).value.trim();
      const password = $("captain-list").querySelector(`[data-cap-pass="${tid}"]`).value;
      if (!username || !password) { toast("需要用户名和密码"); return; }
      try {
        await api(`/api/admin/teams/${tid}/captain`, { method: "PUT", headers: H(),
          body: JSON.stringify({ username, password }) });
        toast(`已保存：${username}`);
        loadCaptains();
      } catch (e) { toast("失败：" + e.message, 4000); }
    });
  } catch (e) { /* ignore */ }
}
async function loadAdminLineups() {
  if (!authed()) return;
  try {
    const rows = await api("/api/admin/lineups");
    $("admin-lineup-list").innerHTML = rows.map((r) => `
      <div class="muted" style="padding:4px 0;border-bottom:1px solid #e5e7eb">
        ${r.date} 第${r.slot}场 · <b>${esc(r.team_name)}</b>：
        ${r.players.map((p) => esc(p.nickname)).join("、")}
        <span style="float:right">${esc(r.submitted_by)} · ${(r.updated_at || "").replace("T", " ").slice(0, 16)}</span>
      </div>`).join("") || `<span class="muted">暂无提交</span>`;
  } catch (e) { /* ignore */ }
}

async function loadAll() { await loadLeague(); await loadTeams(); await loadPlayers(); loadRuns(); loadAutoSync(); loadAdminBounties(); loadAdminClaims(); loadCaptains(); loadAdminLineups(); }
loadAll().catch((e) => toast(e.message));
</script>
</body>
</html>

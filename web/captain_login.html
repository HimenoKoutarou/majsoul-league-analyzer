<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>队长登录</title>
<link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
<nav class="nav">
  <span class="brand">联赛</span>
  <a href="/">首页</a><a href="/games">对局</a>
  <a href="/analysis">分析</a><a href="/lineups">出战名单</a><a href="/bounties">悬赏</a><a href="/captain" class="active">队长</a><a href="/admin">管理</a>
</nav>
<div class="container">
  <div class="login-wrap">
    <form class="login-card" id="login-form">
      <h2>队长登录</h2>
      <p class="muted">账号密码由管理员创建，用于提交本队比赛日出战名单。</p>
      <label>账号
        <input id="username" autocomplete="username" required>
      </label>
      <label>密码
        <input id="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="btn primary">登录</button>
      <p class="muted" id="err" style="margin-top:10px"></p>
    </form>
  </div>
</div>
<script type="module">
import { toast, loadLeagueBrand } from "/static/js/api.js";

const $ = (id) => document.getElementById(id);
loadLeagueBrand();
$("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("err").textContent = "";
  try {
    const resp = await fetch("/api/captain/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: $("username").value, password: $("password").value }),
    });
    if (!resp.ok) {
      let msg = `HTTP ${resp.status}`;
      try { msg = (await resp.json()).detail || msg; } catch (_) {}
      $("err").textContent = msg;
      return;
    }
    const next = new URLSearchParams(location.search).get("next") || "/captain";
    location.href = next;
  } catch (e) {
    toast("网络错误：" + e.message);
  }
});
</script>
</body>
</html>

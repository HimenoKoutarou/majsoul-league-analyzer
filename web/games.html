<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>对局列表</title>
<link rel="stylesheet" href="/static/css/main.css?v=mahjong-layout-2">
<script src="/static/vendor/echarts.min.js"></script>
<style>
  .game-player {
    flex: 1 1 200px;
    min-width: 0;
    padding: 8px 12px;
    border-left: 3px solid var(--team-color, #8b90a3);
    border-radius: 4px;
    background: var(--card2);
  }
  .game-player-top {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 24px;
  }
  .game-team {
    display: inline-flex;
    flex: 1 1 auto;
    align-items: center;
    min-width: 0;
    overflow: hidden;
    color: var(--muted);
    font-size: 12px;
  }
  .game-team .team-dot { flex: 0 0 10px; }
  .team-name-label {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .game-player-name {
    display: block;
    overflow-wrap: anywhere;
    margin-top: 5px;
  }
  .game-player-score {
    margin-top: 3px;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  .seat-team {
    display: inline-flex;
    align-items: center;
    max-width: calc(100% - 30px);
    margin-left: 6px;
    color: var(--muted);
    font-size: 12px;
  }
</style>
</head>
<body>
<nav class="nav">
  <span class="brand">联赛</span>
  <a href="/">首页</a><a href="/games" class="active">对局</a>
  <a href="/analysis">分析</a><a href="/lineups">出战名单</a><a href="/bounties">悬赏</a><a href="/captain">队长</a><a href="/admin">管理</a>
</nav>
<div class="container">
  <h1>对局列表</h1>
  <div id="list"></div>
  <div style="margin-top:16px">
    <button class="btn" id="prev">上一页</button>
    <span class="muted" id="pageinfo" style="margin:0 12px"></span>
    <button class="btn" id="next">下一页</button>
  </div>
</div>
<div id="detail-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);
  z-index:50;overflow:auto;padding:40px 16px">
  <div class="container" style="max-width:1080px;background:var(--bg);border-radius:14px;padding:24px"
       id="detail-body"></div>
</div>
<script type="module">
import { api, esc, loadLeagueBrand } from "/static/js/api.js";
import { doraTiles, tileRow, finalHand, renderFinalHand, sortTiles } from "/static/js/tiles.js?v=red5-final-hand";

let page = 1, total = 0;
const rankBadge = (r) => `<span class="rank-badge rank-${r}">${r}</span>`;
loadLeagueBrand();

async function load() {
  const data = await api(`/api/games?page=${page}&size=20`);
  total = data.total;
  document.getElementById("pageinfo").textContent =
    `第 ${page} 页 / 共 ${Math.max(1, Math.ceil(total / 20))} 页（${total} 场）`;
  document.getElementById("list").innerHTML = data.items.map((g) => `
    <div class="card" style="cursor:pointer;padding:14px 20px;margin-bottom:12px" data-uuid="${g.uuid}">
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap">
        <div class="muted">${g.start_time || "时间未知"} · ${esc(g.rule)}</div>
        <div class="muted">${g.fetched_via === "dhs" ? "赛事场同步" : "链接录入"}</div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px">
        ${g.players.map((p) => `
          <div class="game-player" style="--team-color:${esc(p.team_color || "#8b90a3")}">
            <div class="game-player-top">
              ${rankBadge(p.rank)}
              <span class="game-team">
                <span class="team-dot" style="background:${esc(p.team_color || "#8b90a3")}"></span>
                <span class="team-name-label">${esc(p.team_name || "未分队")}</span>
              </span>
            </div>
            <strong class="game-player-name">${esc(p.nickname)}</strong>
            <div class="muted game-player-score">${p.final_score} 点 · pt ${p.pt > 0 ? "+" : ""}${p.pt}</div>
          </div>`).join("")}
      </div>
    </div>`).join("") || `<div class="card muted">暂无对局</div>`;
  document.querySelectorAll("#list .card[data-uuid]").forEach((el) =>
    el.addEventListener("click", () => {
      location.href = `/games?uuid=${encodeURIComponent(el.dataset.uuid)}`;
    }));
}

async function openDetail(uuid) {
  const g = await api(`/api/games/${uuid}`);
  const body = document.getElementById("detail-body");
  const players = g.players;

  body.innerHTML = `
    <div style="display:flex;justify-content:space-between">
      <h2>${g.start_time || "时间未知"} · ${esc(g.rule)}</h2>
      <button class="btn" onclick="document.getElementById('detail-modal').style.display='none'">关闭</button>
    </div>
    <div class="card"><div id="score-chart" class="chart"></div></div>
    <div id="kyokus"></div>`;
  document.getElementById("detail-modal").style.display = "block";

  // 点数推移：局始点数 + 每局 delta 累计
  const fallbackColors = ["#5470c6", "#91cc75", "#fac858", "#ee6666"];
  const series = players.map((p, index) => {
    const scores = g.kyokus.map((k) => k.summary.start_scores[p.seat]);
    let cur = scores[0];
    const pts = [cur];
    for (const k of g.kyokus) {
      cur += k.summary.deltas[p.seat];
      pts.push(cur);
    }
    const color = p.team_color || fallbackColors[index % fallbackColors.length];
    return { name: p.nickname, type: "line", data: pts,
             color,
             itemStyle: { color },
             lineStyle: { color } };
  });
  echarts.init(document.getElementById("score-chart")).setOption({
    backgroundColor: "transparent",
    tooltip: { trigger: "axis" },
    legend: { textStyle: { color: "#1f2430" } },
    grid: { left: 60, right: 20, top: 40, bottom: 30 },
    xAxis: { type: "category",
             data: ["开局"].concat(g.kyokus.map((k) => k.summary.title)),
             axisLabel: { color: "#6b7280", rotate: 30 } },
    yAxis: { type: "value", axisLabel: { color: "#6b7280" },
             splitLine: { lineStyle: { color: "#e5e7eb" } } },
    series,
  });

  const wrap = document.getElementById("kyokus");
  g.kyokus.forEach((k) => {
    const s = k.summary;
    const sticksStart = Number(s.round?.[2] || 0);
    const card = document.createElement("div");
    card.className = "card";
    const resultHtml = s.end === "agari"
      ? s.agari.map((a) => `<span class="tag win">${esc(players[a.winner].nickname)}
          和了 ${a.score}点 ${a.tsumo ? "(自摸)" : `(放铳:${esc(players[a.loser].nickname)})`}
          ${esc(a.fu_han)}</span>
          ${a.yaku.map((y) => `<span class="tag">${esc(y)}</span>`).join("")}`).join("")
      : s.end === "abortive" ? `<span class="tag">${esc(s.abortive)}（途中流局）</span>`
      : `<span class="tag">${s.end === "nagashi" ? "流し満貫" : "流局"}</span>`;
    card.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <h3 style="margin:0">${s.title}</h3>
          <span class="tag">供托 ${sticksStart}根</span>
        </div>
        <div>${resultHtml}</div>
      </div>
      <div class="muted" style="margin:8px 0">宝牌</div>
      <div id="doras-${k.index}"></div>
      ${s.uras.length ? `<div class="muted" style="margin:4px 0">里宝</div><div id="uras-${k.index}"></div>` : ""}
      <div id="seats-${k.index}" style="margin-top:10px"></div>`;
    wrap.appendChild(card);
    card.querySelector(`#doras-${k.index}`).appendChild(tileRow(doraTiles(s.doras), "small"));
    if (s.uras.length) card.querySelector(`#uras-${k.index}`).appendChild(tileRow(doraTiles(s.uras), "small"));

    const seatsDiv = card.querySelector(`#seats-${k.index}`);
    const finalHands = s.seats.map((_, i) => finalHand(k.data, i));
    s.agari.forEach((a) => {
      const winner = finalHands[a.winner];
      if (a.tsumo) {
        winner.winningTile = winner.lastDrawTile;
      } else {
        const winningTile = finalHands[a.loser].lastDiscardTile;
        if (winningTile != null) {
          winner.hand.push(winningTile);
          winner.winningTile = winningTile;
          sortTiles(winner.hand);
        }
      }
    });
    s.seats.forEach((seat, i) => {
      const p = players[i];
      const row = document.createElement("div");
      row.className = "seat-row";
      const head = document.createElement("div");
      head.className = "seat-head";
      head.innerHTML = `${rankBadge(p.rank)} ${esc(p.nickname)}
        <span class="seat-team">
          <span class="team-dot" style="background:${esc(p.team_color || "#8b90a3")}"></span>
          <span class="team-name-label">${esc(p.team_name || "未分队")}</span>
        </span><br>
        <span class="muted">终局 ${(s.start_scores[i] + s.deltas[i])} 点</span>
        ${seat.riichi ? `<span class="tag riichi">立直 -1000</span>` : ""}
        ${seat.callouts ? `<span class="tag">鸣牌×${seat.callouts}</span>` : ""}`;
      const delta = s.deltas[i] || 0;
      const scoreChange = document.createElement("div");
      scoreChange.className = `score-change ${delta > 0 ? "positive" : "negative"}`;
      scoreChange.textContent = delta > 0 ? `本局 +${delta}` : `本局 ${delta}`;
      const handLabel = document.createElement("div");
      handLabel.className = "muted hand-label";
      handLabel.textContent = "终局手牌";
      const hand = renderFinalHand(finalHands[i]);
      row.append(head);
      if (delta) row.append(scoreChange);
      row.append(handLabel, hand);
      seatsDiv.appendChild(row);
    });
  });
}

document.getElementById("prev").onclick = () => { if (page > 1) { page--; load(); } };
document.getElementById("next").onclick = () => {
  if (page * 20 < total) { page++; load(); } };
document.getElementById("detail-modal").addEventListener("click", (e) => {
  if (e.target.id === "detail-modal") e.target.style.display = "none";
});
load().then(() => {
  const uuid = new URLSearchParams(location.search).get("uuid");
  if (uuid) openDetail(uuid);
}).catch((e) => alert(e.message));
</script>
</body>
</html>

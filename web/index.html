<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>联赛主页</title>
<link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
<nav class="nav">
  <span class="brand" id="brand">麻将联赛</span>
  <a href="/" class="active">首页</a>
  <a href="/games">对局</a>
  <a href="/analysis">分析</a>
  <a href="/lineups">出战名单</a>
  <a href="/bounties">悬赏</a>
  <a href="/captain">队长</a>
  <a href="/admin">管理</a>
</nav>
<div class="container">
  <div class="card" id="league-card" style="display:flex;gap:20px;align-items:center">
    <img id="logo" style="width:84px;height:84px;border-radius:14px;object-fit:cover;display:none" alt="logo">
    <div>
      <h1 id="league-name">—</h1>
      <div class="muted" id="league-meta"></div>
      <div class="muted" id="league-desc" style="margin-top:6px"></div>
    </div>
  </div>
  <div class="home-sections">
    <div class="card">
      <h2>队伍积分榜</h2>
      <div style="overflow:auto"><table id="standings"><thead>
        <tr><th>#</th><th>队伍</th><th>场次</th><th>赛程</th><th>一位</th><th>二位</th><th>三位</th><th>四位</th>
        <th>平均顺位</th><th>积分</th><th>素点</th></tr>
      </thead><tbody></tbody></table></div>
    </div>
    <div class="card">
      <h2>最近对局</h2>
      <div id="recent"></div>
    </div>
  </div>
</div>
<script type="module">
import { api, esc } from "/static/js/api.js";

const rankBadge = (r) => `<span class="rank-badge rank-${r}">${r}</span>`;
const REGULAR_SEASON_GAMES = 45;

async function main() {
  const league = await api("/api/league");
  document.getElementById("league-name").textContent = league.name;
  document.getElementById("brand").textContent = league.name;
  const dates = league.start_date || league.end_date
    ? ` · ${league.start_date || "未定"} 至 ${league.end_date || "未定"}` : "";
  const organizer = league.organizer ? ` · 主办方：${league.organizer}` : "";
  const season = league.season ? ` · ${league.season}` : "";
  document.getElementById("league-meta").textContent =
    `${league.game_count} 场对局 · ${league.team_count} 支队伍 · ${league.player_count} 名选手${season}${organizer}${dates}`;
  document.getElementById("league-desc").textContent = league.description || "";
  if (league.logo_path) {
    const img = document.getElementById("logo");
    img.src = league.logo_path;
    img.style.display = "block";
  }
  document.title = league.name;

  const [st, teams] = await Promise.all([
    api("/api/standings?by=team"),
    api("/api/teams"),
  ]);
  const standingsByTeamId = new Map(
    st.rows.filter((row) => row.team_id != null)
      .map((row, index) => [row.team_id, { ...row, place: index + 1 }])
  );
  const rows = teams.map((team) => ({
    ...(standingsByTeamId.get(team.id) || {}),
    team_id: team.id,
    name: team.name,
    color: team.color,
    logo_path: team.logo_path,
    games: standingsByTeamId.get(team.id)?.games || 0,
    rank_counts: standingsByTeamId.get(team.id)?.rank_counts || [0, 0, 0, 0],
    avg_rank: standingsByTeamId.get(team.id)?.avg_rank || 0,
    points: standingsByTeamId.get(team.id)?.points || 0,
    raw_points: standingsByTeamId.get(team.id)?.raw_points || 0,
    place: standingsByTeamId.get(team.id)?.place || null,
  }));
  const ungrouped = st.rows.find((row) => row.team_id == null);
  if (ungrouped) rows.push({ ...ungrouped, name: "未分组", logo_path: null, place: null });
  const tbody = document.querySelector("#standings tbody");
  tbody.innerHTML = rows.map((r) => `
    <tr>
      <td>${r.place || "—"}</td>
      <td class="home-team-cell">
        ${r.logo_path
          ? `<img class="home-team-logo" src="${esc(r.logo_path)}" alt="">`
          : `<span class="team-dot" style="background:${r.color || "#8b90a3"}"></span>`}
        <span>${esc(r.name)}</span>
      </td>
      <td>${r.games}</td>
      <td>${r.games}/${REGULAR_SEASON_GAMES}</td>
      ${r.rank_counts.map((c) => `<td>${c}</td>`).join("")}
      <td>${r.games ? Number(r.avg_rank).toFixed(2) : "—"}</td>
      <td><b>${r.points}</b></td>
      <td class="muted">${r.raw_points > 0 ? "+" : ""}${Number(r.raw_points || 0).toFixed(1)}</td>
    </tr>`).join("") || `<tr><td colspan="11" class="muted">暂无对局数据</td></tr>`;

  const games = await api("/api/games?size=5");
  const recent = document.getElementById("recent");
  recent.innerHTML = games.items.map((g) => `
    <div class="card" style="margin-bottom:12px;padding:14px">
      <div class="muted">${g.start_time || ""} · ${esc(g.rule)}</div>
      <div style="margin-top:6px">${g.players.map((p) => `
        <span style="margin-right:14px">${rankBadge(p.rank)}
        <span class="team-dot" style="background:${p.team_color || "#555"}"></span>
        ${esc(p.nickname)} <span class="muted">${p.final_score}</span></span>`).join("")}
      </div>
    </div>`).join("") || `<div class="muted">暂无对局，去<a href="/admin">管理后台</a>录入</div>`;
}
main().catch((e) => alert(e.message));
</script>
</body>
</html>
